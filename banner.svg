<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Oliium — Shadow Monarch / Full-Stack Developer">
  <defs>
    <radialGradient id="void" cx="50%" cy="40%" r="80%">
      <stop offset="0%"  stop-color="#111634"/>
      <stop offset="55%" stop-color="#080b1d"/>
      <stop offset="100%" stop-color="#03040c"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%"  stop-color="#5fe9ff"/>
      <stop offset="48%" stop-color="#6aa8ff"/>
      <stop offset="100%" stop-color="#b06bff"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0f1a3c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1024" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#37e0ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#37e0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22b8ff" stop-opacity="0.42"/><stop offset="100%" stop-color="#22b8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2cff" stop-opacity="0.5"/><stop offset="100%" stop-color="#8a2cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gateCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fe3ff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#7b3cff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7b3cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03040c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03040c" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="eyeGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.4"/></filter>

    <g id="sld">
      <ellipse cx="0" cy="-56" rx="13" ry="8" fill="#37e0ff" opacity="0.18" filter="url(#soft)"/>
      <path d="M-17 0 L-17 -52 Q-17 -85 0 -85 Q17 -85 17 -52 L17 0 Z" fill="#05060f" stroke="#7b3cff" stroke-opacity="0.55" stroke-width="1.4"/>
      <path d="M-17 -48 Q0 -58 17 -48" fill="none" stroke="#6a3cff" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="-6" cy="-58" r="2.5" fill="#7fe9ff" filter="url(#eyeGlow)"/>
      <circle cx="6"  cy="-58" r="2.5" fill="#7fe9ff" filter="url(#eyeGlow)"/>
    </g>
  </defs>

  <!-- VOID + halos -->
  <rect width="1200" height="360" fill="url(#void)"/>
  <ellipse cx="560" cy="150" rx="540" ry="230" fill="url(#cyanGlow)"/>
  <ellipse cx="985" cy="180" rx="320" ry="250" fill="url(#purpleGlow)"/>

  <!-- grille faible -->
  <g stroke="#1b2750" stroke-opacity="0.35" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="360"/><line x1="640" y1="0" x2="640" y2="360"/><line x1="960" y1="0" x2="960" y2="360"/>
  </g>

  <!-- PORTE / CERCLE D'INVOCATION -->
  <g transform="translate(985,178)">
    <circle r="124" fill="url(#gateCore)"/>
    <g fill="none">
      <circle r="120" stroke="#7b8cff" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="2 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
      </circle>
      <circle r="98" stroke="#37e0ff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="16 11">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle r="72" stroke="#9d6bff" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle r="50" stroke="#37e0ff" stroke-opacity="0.4" stroke-width="0.8" stroke-dasharray="3 7"/>
    </g>
    <g fill="#9fd8ff" fill-opacity="0.7" font-family="serif" font-size="13" text-anchor="middle">
      <text x="0" y="-104">⟁</text><text x="104" y="5">⟁</text><text x="0" y="116">⟁</text><text x="-104" y="5">⟁</text>
      <text x="74" y="-68">◇</text><text x="74" y="80">◇</text><text x="-74" y="-68">◇</text><text x="-74" y="80">◇</text>
    </g>
    <!-- yeux d'ombre du Monarque -->
    <g filter="url(#neon)">
      <path d="M-42 -6 L-10 -15 L-4 -3 L-36 5 Z" fill="#cdeeff"/>
      <path d="M42 -6 L10 -15 L4 -3 L36 5 Z" fill="#cdeeff"/>
    </g>
    <ellipse cx="0" cy="-2" rx="62" ry="34" fill="#8a2cff" opacity="0.16" filter="url(#soft)">
      <animate attributeName="opacity" values="0.1;0.26;0.1" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ARMÉE D'OMBRES qui se lève -->
  <use href="#sld" transform="translate(858,302) scale(0.72)"/>
  <use href="#sld" transform="translate(948,296) scale(1.0)"/>
  <use href="#sld" transform="translate(1030,302) scale(0.76)"/>
  <use href="#sld" transform="translate(1092,306) scale(0.6)"/>

  <!-- particules de mana -->
  <g fill="#7fe9ff">
    <circle cx="930" cy="250" r="1.8" opacity="0.8"><animate attributeName="cy" values="270;150" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="250" r="1.5" opacity="0.7"><animate attributeName="cy" values="280;140" dur="6.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="975" cy="250" r="1.6" opacity="0.7"><animate attributeName="cy" values="260;150" dur="5.8s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="5.8s" begin="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sol -->
  <rect x="0" y="280" width="1200" height="80" fill="url(#floorFade)"/>

  <!-- FENÊTRE SYSTÈME -->
  <g>
    <rect x="52" y="72" width="724" height="216" rx="10" fill="url(#panelFill)" stroke="#37e0ff" stroke-width="1.6" filter="url(#neon)"/>
    <rect x="52" y="72" width="724" height="216" rx="10" fill="none" stroke="#37e0ff" stroke-width="1.3"/>
    <g stroke="#37e0ff" stroke-width="2.4" fill="none">
      <path d="M64 88 L64 76 L76 76"/><path d="M764 76 L776 76 L776 88"/>
      <path d="M64 272 L64 284 L76 284"/><path d="M776 272 L776 284 L764 284"/>
    </g>
    <text x="86" y="112" font-family="'Courier New',monospace" font-size="16" letter-spacing="4" fill="#5fd0ff" font-weight="700">⟦ THE SYSTEM ⟧</text>
    <!-- chip LEVEL UP -->
    <rect x="600" y="92" width="158" height="28" rx="14" fill="#3a2a08" fill-opacity="0.8" stroke="#ffc53d" stroke-width="1.2"/>
    <text x="679" y="111" font-family="'Courier New',monospace" font-size="13" letter-spacing="2" fill="#ffd96b" text-anchor="middle" font-weight="700">▲ LEVEL UP</text>
    <rect x="600" y="92" width="158" height="28" rx="14" fill="none" stroke="#ffc53d" stroke-width="1.2" opacity="0.9">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <line x1="86" y1="126" x2="742" y2="126" stroke="url(#divGrad)" stroke-width="1.4"/>
    <text x="84" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="3" fill="url(#nameGrad)" filter="url(#neon)">OLIIUM</text>
    <text x="88" y="242" font-family="'Courier New',monospace" font-size="18" letter-spacing="1" fill="#a9c3f0" font-weight="600">JOB&#160;▸&#160; SHADOW MONARCH &#160;//&#160; FULL-STACK DEV</text>
    <text x="88" y="270" font-family="'Courier New',monospace" font-size="13" fill="#5fd0ff" fill-opacity="0.9">[ You have acquired the qualification to be a Player. ] &#9656; Arise.</text>
  </g>
</svg>
