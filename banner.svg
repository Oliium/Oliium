<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Oliium - Full-Stack Developer">
  <defs>
    <!-- Fond arène nocturne -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1230"/>
      <stop offset="55%" stop-color="#070b1f"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>

    <!-- Dégradé titre : bleu équipe -> orange équipe -->
    <linearGradient id="teamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27d0ff"/>
      <stop offset="50%" stop-color="#5e9bff"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b4ff"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0096ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0096ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a18" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ballShade" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#d7e1f2"/>
      <stop offset="100%" stop-color="#9fb0cc"/>
    </radialGradient>

    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd000" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ff8a00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Halos d'équipe -->
  <ellipse cx="120" cy="80" rx="320" ry="220" fill="url(#blueGlow)"/>
  <ellipse cx="1090" cy="240" rx="340" ry="240" fill="url(#orangeGlow)"/>

  <!-- Marquage du terrain (vue du dessus) -->
  <g stroke="#3a5a8f" stroke-opacity="0.35" fill="none" stroke-width="2">
    <rect x="40" y="40" width="1120" height="220" rx="16"/>
    <line x1="600" y1="40" x2="600" y2="260"/>
    <circle cx="600" cy="150" r="58"/>
    <rect x="40" y="95" width="74" height="110" rx="4"/>
    <rect x="1086" y="95" width="74" height="110" rx="4"/>
  </g>

  <!-- Grille perspective subtile -->
  <g stroke="#13234a" stroke-opacity="0.5" stroke-width="1">
    <line x1="200" y1="40" x2="200" y2="260"/>
    <line x1="360" y1="40" x2="360" y2="260"/>
    <line x1="840" y1="40" x2="840" y2="260"/>
    <line x1="1000" y1="40" x2="1000" y2="260"/>
  </g>

  <!-- Pads de boost -->
  <g fill="#ff8a00">
    <circle cx="180" cy="70" r="4" opacity="0.8"/>
    <circle cx="1020" cy="230" r="4" opacity="0.8"/>
    <circle cx="300" cy="235" r="3" opacity="0.6"/>
    <circle cx="900" cy="68" r="3" opacity="0.6"/>
  </g>

  <!-- Boost trail + ballon -->
  <g transform="translate(1000,150)">
    <ellipse cx="-150" cy="0" rx="150" ry="14" fill="url(#flame)" filter="url(#soft)"/>
    <ellipse cx="-110" cy="0" rx="110" ry="9" fill="url(#flame)"/>
    <circle cx="0" cy="0" r="60" fill="#27d0ff" opacity="0.25" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="44" fill="url(#ballShade)" stroke="#bcd0ee" stroke-width="2"/>
    <g stroke="#8fa6c6" stroke-width="1.4" fill="none" opacity="0.8">
      <polygon points="0,-16 15,-5 9,13 -9,13 -15,-5"/>
      <line x1="0" y1="-16" x2="0" y2="-30"/>
      <line x1="15" y1="-5" x2="30" y2="-12"/>
      <line x1="9" y1="13" x2="18" y2="28"/>
      <line x1="-9" y1="13" x2="-18" y2="28"/>
      <line x1="-15" y1="-5" x2="-30" y2="-12"/>
    </g>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#27d0ff" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="50;56;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bloc texte -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="68" y="118" font-size="22" letter-spacing="8" fill="#6ea2ff" font-weight="700">▎ KICKOFF</text>
    <text x="64" y="190" font-size="86" font-weight="800" letter-spacing="2" fill="url(#teamGrad)" filter="url(#neon)">OLIIUM</text>
    <rect x="70" y="206" width="330" height="6" rx="3" fill="url(#barGrad)"/>
    <text x="70" y="246" font-size="26" letter-spacing="3" fill="#aebfe0" font-weight="600">FULL-STACK DEVELOPER</text>
    <text x="70" y="278" font-size="17" letter-spacing="1" fill="#5f7299" font-weight="500">Boost · Build · Ship &#8201;🚀&#8201; What a save!</text>
  </g>
</svg>
